name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install package and dev tools
        run: python -m pip install -e . -r requirements-dev-ci.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Lint Python
        run: ruff check .
      - name: Type check
        run: mypy zeus
      - name: Security scan
        run: bandit -r zeus
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Run test suite
        run: sh scripts/test.sh
      - name: Run repository contract check
        run: sh scripts/repo_check.sh
      - name: Check coverage
        run: |
          coverage erase
          coverage run -m unittest discover -s tests
          coverage report

  python-3-14:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install package and test tools
        run: python -m pip install -e . -r requirements-dev-ci.txt
      - name: Run Zeus test suite
        run: sh scripts/test.sh

  lifecycle-subprocess:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and dev tools
        run: python -m pip install -e . -r requirements-dev-ci.txt
      - name: Run subprocess lifecycle tests
        run: python -m unittest tests.test_subprocess_lifecycle

  audit-docker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZEUS_RUN_DOCKER_ISOLATION: "1"
      ZEUS_AUDIT_TEST_IMAGE: "nikolaik/python-nodejs:python3.11-nodejs20@sha256:8f958bdc1b4a422bfafd97cab4f69836401f616ae985d4b57a53d254f5bcb038"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and dev tools
        run: python -m pip install -e .
      - name: Verify Docker and preload the pinned audit image
        run: |
          docker version
          docker info
          docker pull "$ZEUS_AUDIT_TEST_IMAGE"
      - name: Run real Docker audit isolation test
        run: python -m unittest -v tests.test_audit_docker_isolation.RealDockerAuditIsolationTests.test_real_docker_isolation

  macos-process-lifecycle:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: python -m pip install -e . -r requirements-dev-ci.txt
      - name: Run focused process lifecycle tests
        run: |
          python -m unittest -v \
            tests.test_subprocess_lifecycle \
            tests.test_fake_hermes_integration \
            tests.test_crash_recovery.GatewayLauncherTests

  real-hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Prepare sanitized failure evidence
        run: |
          mkdir -p .tmp/real-hermes-evidence
          printf '%s\n' 'result=failed' 'failure_stage=ci_setup' > .tmp/real-hermes-evidence/summary.txt
      - name: Install pinned Hermes compatibility environment
        run: |-
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-hermes-ci.txt
      - name: Install verified Hermes source release
        run: sh scripts/install_pinned_hermes.sh
      - name: Install Zeus
        run: python -m pip install -e .
      - name: Check pinned dependency overrides
        run: python scripts/check_hermes_dependency_overrides.py
      - name: Verify real Hermes without provider credentials
        run: |
          ZEUS_VERIFY_START_GATEWAY=1 \
          ZEUS_VERIFY_EXPECTED_HERMES_VERSION=0.20.0 \
          ZEUS_VERIFY_EVIDENCE_DIR=.tmp/real-hermes-evidence \
          sh scripts/verify_real_hermes.sh
      - name: Verify pinned Hermes audit broker transcript
        run: python -m unittest -v tests.test_pinned_hermes_audit_broker
      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-hermes-failure-evidence
          path: .tmp/real-hermes-evidence/summary.txt
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package build tools
        run: python -m pip install -e . -r requirements-dev-ci.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build package
        run: |
          rm -rf dist
          python -m build
      - name: Verify installed wheel behavior
        run: ZEUS_WHEEL_SMOKE_BUILD=0 sh scripts/wheel_smoke.sh
      - name: Check package metadata
        run: twine check dist/*
